server:
  listen: "127.0.0.1:9090"

storage:
  sqlite_path: "./statlite-spring-demo.sqlite"
  retention_days: 7

polling:
  # Short interval for a responsive local demo. Use 30s or longer in production.
  interval: "10s"
  timeout: "5s"

targets:
  - name: "spring-demo"
    type: "spring"
    url: "http://127.0.0.1:8080/actuator"

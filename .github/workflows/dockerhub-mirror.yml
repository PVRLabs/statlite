name: mirror release to Docker Hub

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      update_latest:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version (for example, v0.6.0)
        required: true
        type: string
      update_latest:
        description: Also update latest (requires this release to match GHCR latest)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dockerhub-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs and credentials
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'version must match vX.Y.Z' >&2
            exit 1
          fi
          if [ "$DOCKERHUB_USERNAME" != pvrlabs ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Configure DOCKERHUB_USERNAME=pvrlabs and a nonempty DOCKERHUB_TOKEN with push access' >&2
            exit 1
          fi

      - name: Checkout mirror tooling
        uses: actions/checkout@v4

      - name: Confirm existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" \
            | jq -e '.draft == false and .prerelease == false' >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy and verify release images
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: bash scripts/ci/dockerhub-mirror.sh

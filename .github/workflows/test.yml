name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            examples/python-fastapi-demo/requirements.txt
            examples/python-fastapi-demo/requirements-test.txt
            examples/python-django-demo/requirements.txt

      - name: Run dashboard JavaScript unit tests
        run: node --test internal/dashboard/static/dashboard.test.js

      - name: Set up Node for Express demo
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: examples/node-express-demo/package-lock.json

      - name: Install Express demo dependencies
        working-directory: examples/node-express-demo
        run: npm ci

      - name: Run Express integration tests
        working-directory: examples/node-express-demo
        run: npm test

      - name: Install Python demo test dependencies
        run: python -m pip install -r examples/python-fastapi-demo/requirements-test.txt -r examples/python-django-demo/requirements.txt

      - name: Run FastAPI integration tests
        run: python -m unittest examples/python-fastapi-demo/test_statlite_metrics.py

      - name: Run Django integration tests
        working-directory: examples/python-django-demo
        run: python -m unittest test_statlite_metrics.py

      - name: Run Go tests
        run: go test ./...

      - name: Run Go static analysis
        run: go vet ./...

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

  spring-actuator-smoke:
    name: Spring Actuator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build StatLite
        run: go build -trimpath -o "$RUNNER_TEMP/statlite" ./cmd/statlite

      - name: Test and package Spring demo
        working-directory: examples/spring-actuator-demo
        run: mvn --batch-mode --no-transfer-progress package

      - name: Run Spring Actuator smoke test
        env:
          STATLITE_BIN: ${{ runner.temp }}/statlite
        run: ./scripts/smoke-spring-actuator.sh

name: integration certification

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: fastapi
            app_port: 18080
          - case: express
            app_port: 18081
          - case: django
            app_port: 18082
          - case: net-http
            app_port: 8080
          - case: gin
            app_port: 8080
          - case: spring
          - case: quarkus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            examples/go-gin-demo/go.sum

      - name: Set up Python
        if: matrix.case == 'fastapi' || matrix.case == 'django'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            examples/python-fastapi-demo/requirements.txt
            examples/python-fastapi-demo/requirements-test.txt
            examples/python-django-demo/requirements.txt

      - name: Install FastAPI dependencies
        if: matrix.case == 'fastapi'
        run: python -m pip install -r examples/python-fastapi-demo/requirements-test.txt

      - name: Install Django dependencies
        if: matrix.case == 'django'
        run: python -m pip install -r examples/python-django-demo/requirements.txt

      - name: Set up Node
        if: matrix.case == 'express'
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: examples/node-express-demo/package-lock.json

      - name: Set up Java
        if: matrix.case == 'spring' || matrix.case == 'quarkus'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Express dependencies
        if: matrix.case == 'express'
        working-directory: examples/node-express-demo
        run: npm ci

      - name: Report FastAPI versions
        if: matrix.case == 'fastapi'
        run: |
          python --version
          python -c 'import fastapi, uvicorn; print(f"FastAPI {fastapi.__version__}"); print(f"Uvicorn {uvicorn.__version__}")'

      - name: Report Express versions
        if: matrix.case == 'express'
        working-directory: examples/node-express-demo
        run: |
          node --version
          node -p '"Express " + require("express/package.json").version'

      - name: Report Django versions
        if: matrix.case == 'django'
        run: |
          python --version
          python -c 'import django; print(f"Django {django.get_version()}")'

      - name: Report Go integration versions
        if: matrix.case == 'net-http' || matrix.case == 'gin'
        run: |
          go version
          if [ "${{ matrix.case }}" = gin ]; then
            (cd examples/go-gin-demo && go list -m github.com/gin-gonic/gin)
          fi

      - name: Build Spring demo
        if: matrix.case == 'spring'
        working-directory: examples/spring-actuator-demo
        run: mvn --batch-mode --no-transfer-progress package

      - name: Build Quarkus demo
        if: matrix.case == 'quarkus'
        working-directory: examples/quarkus-metrics-demo
        run: mvn --batch-mode --no-transfer-progress package

      - name: Report Spring Boot versions
        if: matrix.case == 'spring'
        working-directory: examples/spring-actuator-demo
        run: |
          java --version
          unzip -p target/spring-actuator-demo-*.jar META-INF/MANIFEST.MF | grep '^Spring-Boot-Version:'

      - name: Report Quarkus versions
        if: matrix.case == 'quarkus'
        working-directory: examples/quarkus-metrics-demo
        run: |
          java --version
          quarkus_version=$(sed -n 's/.*<quarkus.platform.version>\(.*\)<\/quarkus.platform.version>.*/\1/p' pom.xml)
          test -n "$quarkus_version"
          echo "Quarkus $quarkus_version"

      - name: Build StatLite
        run: go build -trimpath -o "$RUNNER_TEMP/statlite" ./cmd/statlite

      - name: Run direct-v1 integration journey
        if: matrix.case == 'fastapi' || matrix.case == 'express' || matrix.case == 'django' || matrix.case == 'net-http' || matrix.case == 'gin'
        env:
          CASE: ${{ matrix.case }}
          APP_PORT: ${{ matrix.app_port }}
          STATLITE_BIN: ${{ runner.temp }}/statlite
        run: ./scripts/ci/integration-direct-v1.sh "$CASE"

      - name: Run Spring integration journey
        if: matrix.case == 'spring'
        env:
          STATLITE_BIN: ${{ runner.temp }}/statlite
        run: ./scripts/ci/smoke-spring-actuator.sh

      - name: Run Quarkus integration journey
        if: matrix.case == 'quarkus'
        env:
          STATLITE_BIN: ${{ runner.temp }}/statlite
        run: ./scripts/ci/integration-quarkus.sh
